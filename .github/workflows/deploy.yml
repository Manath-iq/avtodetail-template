name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Нужно для публикации в Pages через OIDC, без личного токена.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: последний push выигрывает,
# но уже идущую публикацию не рвём.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Проверка типов идёт до настройки Pages: пока Pages не включён,
      # configure-pages падает, и без этого шага прогон не давал бы вообще
      # никакого сигнала о состоянии кода.
      - name: Type check
        run: npx astro check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # Требуется разовая настройка репозитория:
        # Settings → Pages → Build and deployment → Source: GitHub Actions.
        # Включить Pages из workflow (enablement: true) нельзя — у GITHUB_TOKEN
        # нет прав administration: write, вызов падает с «Resource not accessible
        # by integration».

      - name: Build
        env:
          # Astro получает site/base от Pages — при переезде на домен клиента
          # достаточно поменять настройки Pages, а не код.
          # ВАЖНО: после смены домена сайт нужно пересобрать. Артефакт хранит
          # абсолютные пути к ассетам, и сборка со старым base отдаёт на новом
          # домене 404 на весь CSS и JS — страница остаётся голым HTML.
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          # Пока в настройках Pages не включено «Enforce HTTPS», origin приходит
          # по http, и в canonical, og:image и sitemap попал бы http-адрес.
          # Нормализуем схему, чтобы не пересобирать сайт после выпуска
          # сертификата: Pages в итоге всё равно отдаёт домен по https.
          export SITE="${SITE/#http:/https:}"
          echo "SITE=$SITE BASE=${BASE:-/}"
          npm run build:ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
